<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather</title>
<style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap");

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body { margin:0; height:100%; font-family: 'Inter', sans-serif; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
  padding:0;
}

.macbook-air {
  background: linear-gradient(113deg, rgba(35,26,76,1) 0%, rgba(43,1,230,1) 100%);
  width:100%;
  min-height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding: 8vh 20px 40px 20px;
}

.text-wrapper {
  font-family:"arial black";
  font-weight: 900;
  font-size: clamp(40px, 8vw, 100px);
  color:#fff;
  text-shadow:0px 4px 40px rgba(0,0,0,0.7);
  margin-bottom:4vh;
  text-align: center;
}

.search-wrapper {
  width:100%;
  max-width:932px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.rectangle {
  width:100%;
  height: 56px;
  background-color:white;
  border-radius: 28px;
  position:relative;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  z-index: 4;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.35);
}

.rectangle.expanded {
  height: 65vh;
  border-radius: 24px;
}

.search-input {
  width:100%;
  height: 56px;
  border:none;
  background:transparent;
  font-size: 16px;
  font-family:"Inter", sans-serif;
  font-weight: 500;
  padding-left: 20px;
  padding-right: 80px;
  outline:none;
  color:#000;
}
.search-input::placeholder {
    color: rgba(0,0,0,0.7);
}

.expanded-content {
  display: none;
  height: calc(100% - 56px);
  display: flex;
  flex-direction: column;
}
.rectangle.expanded .expanded-content {
  display: flex;
}
.rectangle.expanded .search-input {
  border-bottom: 1px solid #eee;
}

.filter-container {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid #f5f5f5;
  background: #fafafa;
}

.filter-bar {
  display: flex;
  gap: 8px;
  padding: 10px 20px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar {
  display: none;
}

#sub-filter-bar {
  border-top: 1px solid #f0f0f0;
  padding: 8px 20px;
  display: none;
}

.filter-btn {
  background: #ededed;
  border: none;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  color: #555;
  cursor: pointer;
  transition: all 0.2s ease;
}
.filter-btn.active {
  background: rgba(43,1,230,1);
  color: white;
}

#sub-filter-bar .filter-btn {
  background: #fff;
  border: 1px solid #ddd;
  color: #666;
}
#sub-filter-bar .filter-btn.active {
  background: #333;
  border-color: #333;
  color: white;
}

.expanded-scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 15px 20px 20px 20px;
}

.close-btn {
  position: absolute;
  top: 14px;
  right: 20px;
  background: #f0f0f0;
  border: none;
  font-weight: bold;
  padding: 6px 14px;
  border-radius: 14px;
  cursor: pointer;
  display: none;
  font-size: 12px;
  z-index: 10;
}
.rectangle.expanded .close-btn {
  display: block;
}

.see-all-notch {
  background: white;
  color: rgba(43,1,230,1);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 22px 6px 22px;
  border-radius: 0 0 12px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  margin-top: -1px;
  z-index: 5; /* MODIFIÉ : Passe de 3 à 5 pour dompter le z-index: 4 de la barre */
  transition: opacity 0.2s ease;
  position: relative;
  box-shadow: 0px 10px 15px rgba(0,0,0,0.2); 
}
.see-all-notch span {
  font-size: 8px;
}

.see-all-notch::before, .see-all-notch::after {
  content: "";
  position: absolute;
  top: 0;
  width: 12px;
  height: 12px;
  background: transparent;
  pointer-events: none;
}
.see-all-notch::before {
  left: -12px;
  border-radius: 0 12px 0 0;
  box-shadow: 4px -4px 0 0 white;
}
.see-all-notch::after {
  right: -12px;
  border-radius: 12px 0 0 0;
  box-shadow: -4px -4px 0 0 white;
}

.results {
  width:100%;
  max-width:932px;
  max-height:55vh; 
  margin-top:2vh;  
  overflow-y:auto; 
}

.result {
  background:white;
  padding:12px 16px; 
  margin-bottom:8px;  
  border-radius:12px; 
  box-shadow:0px 3px 8px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

.expanded-scroll-area .result {
  box-shadow: 0px 2px 5px rgba(0,0,0,0.05);
  border: 1px solid #eee;
}

.category { 
  font-weight:700; 
  color:#555; 
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 8px; 
  display: inline-block;
  line-height: 1;
}

.subcategory-badge {
  background: #e6e6ff !important;
  color: rgba(43,1,230,1) !important;
}

.word-line {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  font-size:18px; 
  font-weight:700; 
  line-height: 1.3;
  color: #000;
}

.subword { 
  margin-left:15px; 
  margin-top: 6px;  
  margin-bottom: 2px; 
  line-height: 1.3;
  font-size: 15px;
}

.highlight { background: yellow; }

.etym-container {
  display: inline-flex;
  margin-left: 6px;
  cursor: pointer;
  align-items: center;
  vertical-align: middle;
}

.info-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 18px;
  height: 18px;
  background-color: rgba(43,1,230,1);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  font-family: serif;
}

#global-tooltip {
  position: fixed;
  z-index: 999999; 
  pointer-events: none; 
  display: none; 
  width: 280px;
  background-color: rgba(255, 255, 255, 0.45) !important; 
  color: #111;
  text-align: left;
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.4;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.25);
  font-weight: 500;
  backdrop-filter: blur(15px) !important;
  -webkit-backdrop-filter: blur(15px) !important;
}

@media (max-width: 340px) {
  #global-tooltip { width: 240px; }
}

.tooltip-title {
  display: block;
  font-weight: 900;
  font-size: 13px;
  text-transform: uppercase;
  color: rgba(43,1,230,1);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
</style>

<div id="global-tooltip"></div>

<script>
const globalTooltip = document.getElementById('global-tooltip');
let activeIcon = null;

function showTooltip(icon) {
  const title = icon.getAttribute('data-title') || "Étymologie";
  const text = icon.getAttribute('data-text');
  if (!text) return;

  globalTooltip.innerHTML = `<span class="tooltip-title">${title}</span>${text}`;
  globalTooltip.style.display = 'block';

  const rect = icon.getBoundingClientRect();
  let topPosition = rect.top + window.scrollY - globalTooltip.offsetHeight - 10;
  let leftPosition = rect.left + window.scrollX - (globalTooltip.offsetWidth / 2) + (rect.width / 2);

  if (leftPosition < 10) leftPosition = 10;
  if (leftPosition + globalTooltip.offsetWidth > window.innerWidth - 10) {
    leftPosition = window.innerWidth - globalTooltip.offsetWidth - 10;
  }

  globalTooltip.style.top = topPosition + 'px';
  globalTooltip.style.left = leftPosition + 'px';
  activeIcon = icon;
}

function hideTooltip() {
  globalTooltip.style.display = 'none';
  activeIcon = null;
}

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

if (!isTouchDevice) {
  document.addEventListener('mouseover', function(e) {
    const icon = e.target.closest('.info-icon');
    if (icon) showTooltip(icon);
  });
  document.addEventListener('mouseout', function(e) {
    if (e.target.closest('.info-icon')) hideTooltip();
  });
} else {
  document.addEventListener('click', function(e) {
    const icon = e.target.closest('.info-icon');
    if (icon) {
      e.stopPropagation();
      if (activeIcon === icon) { hideTooltip(); } else { showTooltip(icon); }
    } else { hideTooltip(); }
  });
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://hfrdzcjfienvegrofszz.supabase.co";
const SUPABASE_KEY = "sb_publishable_U6qUMbeePU0ykN99-OQsNg_FGYTo0iZ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");
const searchContainer = document.getElementById("search-container");
const seeAllTrigger = document.getElementById("see-all-trigger");
const closeExpanded = document.getElementById("close-expanded");
const expandedResults = document.getElementById("expanded-results");
const mainFilterBar = document.getElementById("main-filter-bar");
const subFilterBar = document.getElementById("sub-filter-bar");

let currentMainFilter = "Tous";
let currentSubFilter = "Tous";

function highlight(text, query){
  if(!text || !query) return text || "";
  const regex = new RegExp(`\\b(${query})\\b|(${query})`, 'gi');
  return text.replace(regex, `<span class="highlight">$1$2</span>`);
}

function createEtymHtml(etymText) {
  if (!etymText) return '';
  return `<span class="etym-container">
            <span class="info-icon" data-title="Étymologie" data-text="${etymText.replace(/"/g, '&quot;')}">i</span>
          </span>`;
}

function displayWordFromSupabase(row, query, targetContainer) {
  const div = document.createElement("div");
  div.classList.add("result");

  const category = row.categorie || "Mot";
  const subcategory = row.sous_categorie || null;
  let traductions = [];
  if (row.mots_francais) {
    traductions = Array.isArray(row.mots_francais) ? row.mots_francais : [row.mots_francais];
  }

  let html = "";

  if (row.directionRecherche === "FR_TO_RATHER") {
    const principalFr = traductions[0] ? traductions[0].traduction_fr : "Mot français";
    const contexteFr = traductions[0]?.contexte_fr ? `(${traductions[0].contexte_fr}) ` : '';
     
    html += `<div class="word-line">`;
    html += `<span class="category">${category}</span>`;
    if(subcategory) {
      html += `<span class="category subcategory-badge">${subcategory}</span>`;
    }
    html += `<span>${contexteFr}${highlight(principalFr, query)} :</span>`;
    if (traductions[0]?.etymologie) {
      html += ` ${createEtymHtml(traductions[0].etymologie)}`;
    }
    html += `</div>`;
     
    html += `<div class="subword" style="font-size: 0.9em; color: rgba(0,0,0,0.75); margin-top: 2px;">
              ➔ Traduction en Rather : <strong style="color: #000;">${highlight(row.mot, query)}</strong>
              ${row.etymologie ? createEtymHtml(row.etymologie) : ''}
            </div>`;

  } else {
    html += `<div class="word-line">`;
    html += `<span class="category">${category}</span>`;
    if(subcategory) {
      html += `<span class="category subcategory-badge">${subcategory}</span>`;
    }
    html += `<span>${highlight(row.mot, query)} :</span>`;
    if (row.etymologie) {
      html += ` ${createEtymHtml(row.etymologie)}`;
    }
    html += `</div>`;

    if (traductions.length > 0) {
      traductions.forEach(sig => {
        const contexte = sig.contexte_fr ? `<span class="category" style="background:none; padding:0; color:#555; font-size:12px; margin-right:3px;">(${sig.contexte_fr})</span> ` : '';
        html += `<div class="subword">
                  ${contexte}${highlight(sig.traduction_fr, query)}
                  ${createEtymHtml(sig.etymologie)}
                </div>`;
      });
    } else {
      html += `<div class="subword" style="color: #666; font-style: italic;">Aucune traduction enregistrée</div>`;
    }
  }

  div.innerHTML = html;
  targetContainer.appendChild(div);
}

function applyFiltersInExpanded() {
  expandedResults.innerHTML = "";
  if (!window.allWordsCache) return;

  let query = searchInput.value.toLowerCase().trim();

  const filtered = window.allWordsCache.filter(item => {
    if (currentMainFilter !== "Tous") {
      const catItem = (item.categorie || "Mot").toLowerCase().trim();
      if (catItem !== currentMainFilter.toLowerCase().trim()) return false;
    }

    if (currentSubFilter !== "Tous") {
      const subCatItem = (item.sous_categorie || "").toLowerCase().trim();
      if (subCatItem !== currentSubFilter.toLowerCase().trim()) return false;
    }
     
    const matchRather = item.mot && item.mot.toLowerCase().includes(query);
    const matchFr = item.mots_francais && (Array.isArray(item.mots_francais) ? item.mots_francais : [item.mots_francais]).some(f => f.traduction_fr && f.traduction_fr.toLowerCase().includes(query));
     
    return matchRather || matchFr;
  });

  if(filtered.length === 0) {
    expandedResults.innerHTML = "<div style='color:#666; text-align:center; padding-top:20px; font-size:14px;'>Aucun résultat trouvé.</div>";
  } else {
    filtered.forEach(row => displayWordFromSupabase(row, query, expandedResults));
  }
}

function updateSubCategoryBar() {
  subFilterBar.innerHTML = "";
  currentSubFilter = "Tous";

  if (currentMainFilter === "Tous" || !window.allWordsCache) {
    subFilterBar.style.display = "none";
    return;
  }

  const subCategories = new Set();
  window.allWordsCache.forEach(item => {
    const itemCat = (item.categorie || "").trim().toLowerCase();
    if (itemCat === currentMainFilter.toLowerCase() && item.sous_categorie) {
      subCategories.add(item.sous_categorie.trim());
    }
  });

  if (subCategories.size === 0) {
    subFilterBar.style.display = "none";
    return;
  }

  subFilterBar.style.display = "flex";
  const sortedSubCategories = ["Tous", ...Array.from(subCategories).sort()];

  sortedSubCategories.forEach(subCat => {
    const btn = document.createElement("button");
    btn.classList.add("filter-btn");
    if(subCat === "Tous") btn.classList.add("active");
    btn.textContent = subCat;

    btn.addEventListener("click", () => {
      subFilterBar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentSubFilter = subCat;
      applyFiltersInExpanded();
    });

    subFilterBar.appendChild(btn);
  });
}

function buildMainFilterButtons(data) {
  mainFilterBar.innerHTML = "";
  subFilterBar.innerHTML = "";
  subFilterBar.style.display = "none";
  currentMainFilter = "Tous";
  currentSubFilter = "Tous";

  const categories = new Set();
  data.forEach(item => {
    if(item.categorie) categories.add(item.categorie.trim());
  });

  const sortedCategories = ["Tous", ...Array.from(categories).sort()];

  sortedCategories.forEach(cat => {
    const btn = document.createElement("button");
    btn.classList.add("filter-btn");
    if(cat === "Tous") btn.classList.add("active");
    btn.textContent = cat;

    btn.addEventListener("click", () => {
      mainFilterBar.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentMainFilter = cat;
       
      updateSubCategoryBar();
      applyFiltersInExpanded();
    });

    mainFilterBar.appendChild(btn);
  });
}

seeAllTrigger.addEventListener("click", async () => {
  searchContainer.classList.add("expanded");
  seeAllTrigger.style.opacity = "0";
  seeAllTrigger.style.pointerEvents = "none";
  mainFilterBar.innerHTML = "";
  subFilterBar.innerHTML = "";
  subFilterBar.style.display = "none";
  expandedResults.innerHTML = "<div style='color:#666; text-align:center; padding-top:30px; font-size:14px;'>Chargement complet de la base de données...</div>";
  resultsDiv.innerHTML = "";
  searchInput.value = "";
  searchInput.placeholder = "Filtrer dans tout le dictionnaire...";

  let allRecords = [];
  let from = 0;
  let to = 99;
  let hasMore = true;

  try {
    while (hasMore) {
      const { data, error } = await supabaseClient
        .from('mots_rather')
        .select('mot, categorie, sous_categorie, etymologie, mots_francais(traduction_fr, contexte_fr, etymologie)')
        .order('mot', { ascending: true })
        .range(from, to);

      if (error) throw error;

      if (data && data.length > 0) {
        allRecords = allRecords.concat(data);
        from += 100;
        to += 100;
        if (data.length < 100) hasMore = false;
      } else {
        hasMore = false;
      }
    }

    window.allWordsCache = allRecords.map(item => ({ ...item, directionRecherche: "RATHER_TO_FR" }));
     
    buildMainFilterButtons(window.allWordsCache);
    applyFiltersInExpanded();

  } catch (err) {
    expandedResults.innerHTML = "<div style='color:#666; text-align:center; padding-top:20px;'>Erreur lors du chargement des mots.</div>";
  }
});

closeExpanded.addEventListener("click", () => {
  searchContainer.classList.remove("expanded");
  seeAllTrigger.style.opacity = "1";
  seeAllTrigger.style.pointerEvents = "auto";
  searchInput.value = "";
  searchInput.placeholder = "Tape le mot que tu veux rechercher !";
  expandedResults.innerHTML = "";
  mainFilterBar.innerHTML = "";
  subFilterBar.innerHTML = "";
  subFilterBar.style.display = "none";
  window.allWordsCache = null;
});

searchInput.addEventListener("input", async () => {
  // Ici on garde les espaces pendant la frappe pour compter les paliers
  let query = searchInput.value.toLowerCase();
  
  if (searchContainer.classList.contains("expanded")) {
    applyFiltersInExpanded();
    return;
  }

  resultsDiv.innerHTML = "";
  if(!query.trim()) return;

  const requeteRather = supabaseClient
    .from('mots_rather')
    .select('mot, categorie, sous_categorie, etymologie, mots_francais(traduction_fr, contexte_fr, etymologie)')
    .ilike('mot', `%${query.trim()}%`);

  const requeteFrancais = supabaseClient
    .from('mots_francais')
    .select('traduction_fr, contexte_fr, etymologie, mots_rather(mot, categorie, sous_categorie, etymologie)')
    .ilike('traduction_fr', `%${query.trim()}%`);

  const [resRather, resFrancais] = await Promise.all([requeteRather, requeteFrancais]);

  const donneesRather = resRather.data || [];
  const donneesFrancais = [];

  if (resFrancais.data) {
    resFrancais.data.forEach(item => {
      if (item.mots_rather) {
        const ratherObj = Array.isArray(item.mots_rather) ? item.mots_rather[0] : item.mots_rather;
        if (ratherObj) {
          donneesFrancais.push({
            mot: ratherObj.mot,
            categorie: ratherObj.categorie,
            sous_categorie: ratherObj.sous_categorie,
            etymologie: ratherObj.etymologie,
            mots_francais: [item]
          });
        }
      }
    });
  }

  const listePlat = [...donneesRather, ...donneesFrancais];
  let meilleurScoreRatherGlobal = 0;
  let meilleurScoreFrGlobal = 0;

  const resultatsScorés = listePlat.map(item => {
    const ratherMot = item.mot ? item.mot.toLowerCase().trim() : "";
     
    let scoreRather = 0;
    if (ratherMot === query.trim()) scoreRather = 100;
    else if (ratherMot.startsWith(query.trim())) scoreRather = 50;
    else if (ratherMot.includes(query.trim())) scoreRather = 10;

    if (ratherMot) {
      const diffTaille = ratherMot.length - query.trim().length;
      scoreRather -= diffTaille * 0.5;
    }
    if (scoreRather > meilleurScoreRatherGlobal) meilleurScoreRatherGlobal = scoreRather;

    let scoreFr = 0;
    let aUnMatchFr = false; 

    if (item.mots_francais && Array.isArray(item.mots_francais)) {
      item.mots_francais.forEach(f => {
        if (f.traduction_fr) {
          const trad = f.traduction_fr.toLowerCase().trim();
          let currentFrScore = 0;
          if (trad === query.trim()) currentFrScore = 100;
          else if (trad.startsWith(query.trim())) currentFrScore = 50;
          else if (trad.includes(query.trim())) currentFrScore = 10;

          if (currentFrScore > 0) aUnMatchFr = true;

          const diffTailleFr = trad.length - query.trim().length;
          currentFrScore -= diffTailleFr * 0.5;

          if (currentFrScore > scoreFr) scoreFr = currentFrScore;
        }
      });
    }
    if (scoreFr > meilleurScoreFrGlobal) meilleurScoreFrGlobal = scoreFr;

    return { ...item, scoreRather, scoreFr, aUnMatchFr };
  });

  const modeExclusif = meilleurScoreRatherGlobal >= meilleurScoreFrGlobal ? "RATHER_ONLY" : "FR_ONLY";

  let resultatsFiltrés = resultatsScorés.filter(item => {
    return modeExclusif === "RATHER_ONLY" ? item.scoreRather > 0 : item.aUnMatchFr;
  }).map(item => {
    return {
      ...item,
      finalScore: modeExclusif === "RATHER_ONLY" ? item.scoreRather : item.scoreFr,
      directionRecherche: modeExclusif === "RATHER_ONLY" ? "RATHER_TO_FR" : "FR_TO_RATHER"
    };
  });

  resultatsFiltrés.sort((a, b) => b.finalScore - a.finalScore);

  const motsAutorises = new Set();
  const limiteMaxMotsDistincts = 5;

  // 1. On compte les espaces saisis par l'utilisateur (le palier actuel)
  const nombreEspacesQuery = (query.match(/ /g) || []).length;

  resultatsFiltrés.forEach(item => {
    let cleMotEtudie = "";
    if (item.directionRecherche === "FR_TO_RATHER" && item.mots_francais && item.mots_francais[0]) {
      cleMotEtudie = item.mots_francais[0].traduction_fr.toLowerCase().trim();
    } else {
      cleMotEtudie = item.mot.toLowerCase().trim();
    }

    // 2. On compte les espaces présents dans l'expression de la base de données
    const nombreEspacesMot = (cleMotEtudie.match(/ /g) || []).length;

    // 3. RÈGLE DES PALIERS : L'expression doit avoir STRICTEMENT le même nombre d'espaces
    if (nombreEspacesMot !== nombreEspacesQuery) {
      return; // On zappe les expressions trop courtes ou trop longues
    }

    const estCorrespondanceExacte = (cleMotEtudie === query.trim());
    
    if (estCorrespondanceExacte) {
      displayWordFromSupabase(item, query.trim(), resultsDiv);
    } else if (motsAutorises.has(cleMotEtudie) || motsAutorises.size < limiteMaxMotsDistincts) {
      motsAutorises.add(cleMotEtudie);
      displayWordFromSupabase(item, query.trim(), resultsDiv);
    }
  });
});
</script>
