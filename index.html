<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather</title>
<style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap");

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body { margin:0; height:100%; font-family: 'Inter', sans-serif; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
  padding:0;
}

.macbook-air {
  background: linear-gradient(113deg, rgba(35,26,76,1) 0%, rgba(43,1,230,1) 100%);
  width:100vw;
  height:100vh;
  min-width:1280px;
  min-height:832px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10vh;
}

.text-wrapper {
  font-family:"arial black";
  font-weight: 900;
  font-size: 10vw;
  color:#fff;
  text-shadow:0px 4px 40px rgba(0,0,0,0.7);
  margin-bottom:5vh;
}

.rectangle {
  width:60vw;
  max-width:932px;
  height:7vh;
  background-color:white;
  border-radius: 10vh;
  box-shadow:0px 4px 30px rgba(0,0,0,0.5);
  position:relative;
}

.search-input {
  width:100%;
  height:100%;
  border:none;
  background:transparent;
  font-size:2vh;
  font-family:"Inter", sans-serif;
  font-weight: 500;
  padding-left:2vw;
  outline:none;
  color:#000;
}
.search-input::placeholder {
    color: rgba(0,0,0,0.7);
}

.div {
  color:rgba(0,0,0,0.7);
  text-shadow:0px 4px 10px rgba(0,0,0,0.5);
  font-size:2vh;
  margin-top:1vh;
  text-align:center;
}

.results {
  width:60vw;
  max-width:932px;
  max-height:55vh; 
  margin-top:2vh;  
  overflow-y:auto; 
}

/* MODIFIÉ : C'est ici qu'on ancre la popup maintenant pour qu'elle ne soit plus coupée */
.result {
  background:white;
  padding:10px 14px; 
  margin-bottom:6px;  
  border-radius:12px; 
  box-shadow:0px 3px 8px rgba(0,0,0,0.4);
  position: relative; /* La popup va se caler par rapport à ce bloc entier */
  display: flex;
  flex-direction: column;
}

.category { 
  font-weight:700; 
  color:#555; 
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  background: #f0f0f0;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 8px; 
  display: inline-block;
  line-height: 1;
}

.word-line {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  font-size:18px; 
  font-weight:700; 
  line-height: 1.2;
  color: #000;
}

.translation { font-size:15px; color:#333; margin-left:5px; }

.subword { 
  margin-left:15px; 
  margin-top: 4px;  
  margin-bottom: 2px; 
  line-height: 1.2;
}

.highlight { background: yellow; }

/* MODIFIÉ : On nettoie le container de l'icône */
.etym-container {
  display: inline-flex;
  margin-left: 6px;
  cursor: pointer;
  align-items: center;
  vertical-align: middle;
}

.info-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 15px;
  height: 15px;
  background-color: rgba(43,1,230,1);
  color: white;
  border-radius: 50%;
  font-size: 10px;
  font-weight: bold;
  font-family: serif;
}

/* LA POPUP COMPLÈTEMENT RE-PENSÉE : Impossible à rogner + Retour du flou iOS */
.tooltip {
  visibility: hidden;
  /* Elle prend la largeur du bloc blanc moins le padding */
  width: calc(100% - 28px); 
  
  /* Fond givré ultra propre */
  background-color: rgba(255, 255, 255, 0.85) !important; 
  color: #111;
  text-align: left;
  border-radius: 8px;
  padding: 10px 12px;
  
  /* Sécurité absolue : elle se place au pixel près au fond de la boîte blanche du mot */
  position: absolute;
  z-index: 999;
  bottom: 8px;
  left: 14px;
  
  opacity: 0;
  transition: opacity 0.2s ease-in-out;
  font-size: 13px;
  line-height: 1.4;
  box-shadow: 0px 4px 15px rgba(0,0,0,0.15);
  font-weight: 500;
  
  /* Le flou revient à 100% car on n'essaie plus de déborder du scroll */
  backdrop-filter: blur(12px) !important;
  -webkit-backdrop-filter: blur(12px) !important;
}

.tooltip-title {
  display: block;
  font-weight: 900;
  font-size: 13px;
  text-transform: uppercase;
  color: rgba(43,1,230,1);
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}

/* Quand on survole l'icône, la popup apparaît magnifiquement dans sa boîte */
.etym-container:hover ~ .tooltip,
.etym-container:hover .tooltip {
  visibility: visible !important;
  opacity: 1 !important;
}
</style>
</head>
<body>

<div class="macbook-air">
  <div class="text-wrapper">Rather</div>
  <div class="rectangle">
    <input type="text" id="search" class="search-input" placeholder="Tape le mot que tu veux rechercher !">
  </div>
  <div class="results" id="results"></div>
</div>


<!-- 1. ON CHARGE LA BIBLIOTHÈQUE SUPABASE TOUT EN HAUT DU SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 2. CONFIGURATION DE TA CONNEXION
const SUPABASE_URL = "https://hfrdzcjfienvegrofszz.supabase.co";
const SUPABASE_KEY = "sb_publishable_U6qUMbeePU0ykN99-OQsNg_FGYTo0iZ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");

// Garde ta fonction de surlignage intacte !
function highlight(text, query){
  if(!text || !query) return text || "";
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

// Génère la petite icône 'i' avec l'infobulle d'étymologie
function createEtymHtml(etymText) {
  if (!etymText) return "";
  return `<span class="etym-container">
            <span class="info-icon">i</span>
            <span class="tooltip">
              <span class="tooltip-title">Étymologie</span>
              ${etymText}
            </span>
          </span>`;
}

// 3. LA FONCTION D'AFFICHAGE INTELLIGENTE ET INVERSABLE !
function displayWordFromSupabase(row, query) {
  const div = document.createElement("div");
  div.classList.add("result");

  const category = row.categorie || "Mot";
  
  // Sécurité pour les traductions
  let traductions = [];
  if (row.mots_francais) {
    traductions = Array.isArray(row.mots_francais) ? row.mots_francais : [row.mots_francais];
  }

  let html = "";

  // --- LE DESIGN S'ADAPTE AU SENS DE LA RECHERCHE ---
  if (row.directionRecherche === "FR_TO_RATHER") {
    const principalFr = traductions[0] ? traductions[0].traduction_fr : "Mot français";
    const contexteFr = traductions[0]?.contexte_fr ? `(${traductions[0].contexte_fr}) ` : '';
    
    // Conteneur en ligne : catégorie + mot + étymologie + les deux points collés !
    html += `<div class="word-line">`;
    html += `<span class="category">${category}</span>`;
    html += `<span>${contexteFr}${highlight(principalFr, query)} :</span>`;
    if (traductions[0]?.etymologie) {
      html += ` ${createEtymHtml(traductions[0].etymologie)}`;
    }
    html += `</div>`;
    
    html += `<div class="subword" style="font-size: 0.9em; color: rgba(0,0,0,0.75); margin-top: 2px;">
              ➔ Traduction en Rather : <strong style="color: #000;">${highlight(row.mot, query)}</strong>
              ${row.etymologie ? createEtymHtml(row.etymologie) : ''}
            </div>`;

  } else {
    // Mode Rather vers Français
    html += `<div class="word-line">`;
    html += `<span class="category">${category}</span>`;
    html += `<span>${highlight(row.mot, query)} :</span>`;
    if (row.etymologie) {
      html += ` ${createEtymHtml(row.etymologie)}`;
    }
    html += `</div>`;

    if (traductions.length > 0) {
      traductions.forEach(sig => {
        const contexte = sig.contexte_fr ? `<span class="category" style="background:none; padding:0; color:#555; font-size:12px; margin-right:3px;">(${sig.contexte_fr})</span> ` : '';
        html += `<div class="subword">
                  ${contexte}${highlight(sig.traduction_fr, query)}
                  ${createEtymHtml(sig.etymologie)}
                </div>`;
      });
    } else {
      html += `<div class="subword" style="color: #666; font-style: italic;">Aucune traduction enregistrée</div>`;
    }
  }

  div.innerHTML = html;
  resultsDiv.appendChild(div);
}

// 4. L'ÉCOUTEUR DE RECHERCHE AVEC FILTRE D'AFFICHAGE EXCLUSIF
searchInput.addEventListener("input", async () => {
  let query = searchInput.value.toLowerCase().trim();
  resultsDiv.innerHTML = "";
  if(!query) return;

  // Requêtes parallèles sur Supabase
  const requeteRather = supabaseClient
    .from('mots_rather')
    .select('mot, categorie, etymologie, mots_francais(traduction_fr, contexte_fr, etymologie)')
    .ilike('mot', `%${query}%`);

  const requeteFrancais = supabaseClient
    .from('mots_francais')
    .select('traduction_fr, contexte_fr, etymologie, mots_rather(mot, categorie, etymologie)')
    .ilike('traduction_fr', `%${query}%`);

  const [resRather, resFrancais] = await Promise.all([requeteRather, requeteFrancais]);

  if (resRather.error) console.error("Erreur recherche Rather :", resRather.error);
  if (resFrancais.error) console.error("Erreur recherche Français :", resFrancais.error);

  const donneesRather = resRather.data || [];
  const donneesFrancais = [];

  if (resFrancais.data) {
    resFrancais.data.forEach(item => {
      if (item.mots_rather) {
        const ratherObj = Array.isArray(item.mots_rather) ? item.mots_rather[0] : item.mots_rather;
        if (ratherObj) {
          donneesFrancais.push({
            mot: ratherObj.mot,
            categorie: ratherObj.categorie,
            etymologie: ratherObj.etymologie,
            mots_francais: [item]
          });
        }
      }
    });
  }

  // Fusion et dédoublonnement
  const listePlat = [...donneesRather, ...donneesFrancais];
  const resultatsUniques = [];
  const motsVus = new Set();

  listePlat.forEach(item => {
    if (item.mot && !motsVus.has(item.mot)) {
      motsVus.add(item.mot);
      resultatsUniques.push(item);
    }
  });

  // CORRIGÉ : Plus d'espace ici !
  let meilleurScoreRatherGlobal = 0;
  let meilleurScoreFrGlobal = 0;

  // Premier passage : On calcule les scores individuels
  const resultatsScorés = resultatsUniques.map(item => {
    const ratherMot = item.mot ? item.mot.toLowerCase() : "";
    
    // 1. Score Rather
    let scoreRather = 0;
    if (ratherMot === query) scoreRather = 100;
    else if (ratherMot.startsWith(query)) scoreRather = 50;
    else if (ratherMot.includes(query)) scoreRather = 10;

    if (ratherMot) {
      const diffTaille = ratherMot.length - query.length;
      scoreRather -= diffTaille * 0.5;
    }
    if (scoreRather > meilleurScoreRatherGlobal) meilleurScoreRatherGlobal = scoreRather;

    // 2. Score Français
    let scoreFr = 0;
    let aUnMatchFr = false; 
    if (item.mots_francais && Array.isArray(item.mots_francais)) {
      item.mots_francais.forEach(f => {
        if (f.traduction_fr) {
          const trad = f.traduction_fr.toLowerCase();
          let currentFrScore = 0;
          if (trad === query) currentFrScore = 100;
          else if (trad.startsWith(query)) currentFrScore = 50;
          else if (trad.includes(query)) currentFrScore = 10;

          if (currentFrScore > 0) aUnMatchFr = true;

          const diffTailleFr = trad.length - query.length;
          currentFrScore -= diffTailleFr * 0.5;

          if (currentFrScore > scoreFr) scoreFr = currentFrScore;
        }
      });
    }
    if (scoreFr > meilleurScoreFrGlobal) meilleurScoreFrGlobal = scoreFr;

    return { ...item, scoreRather, scoreFr, aUnMatchFr };
  });

  // Détermination du sens exclusif de la recherche
  const modeExclusif = meilleurScoreRatherGlobal >= meilleurScoreFrGlobal ? "RATHER_ONLY" : "FR_ONLY";

  // Filtrage strict
  const resultatsFiltrés = resultatsScorés.filter(item => {
    if (modeExclusif === "RATHER_ONLY") {
      return item.scoreRather > 0;
    } else {
      return item.aUnMatchFr;
    }
  }).map(item => {
    return {
      ...item,
      finalScore: modeExclusif === "RATHER_ONLY" ? item.scoreRather : item.scoreFr,
      directionRecherche: modeExclusif === "RATHER_ONLY" ? "RATHER_TO_FR" : "FR_TO_RATHER"
    };
  });

  // Tri final
  resultatsFiltrés.sort((a, b) => {
    if (b.finalScore === a.finalScore) {
      return a.mot.localeCompare(b.mot);
    }
    return b.finalScore - a.finalScore;
  });

  // Affichage final du top 5 filtré
  if (resultatsFiltrés.length > 0) {
    resultatsFiltrés.slice(0, 5).forEach(row => displayWordFromSupabase(row, query));
  }
});
</script>
</body>
</html>
