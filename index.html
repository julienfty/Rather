<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather</title>
<style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap");

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

/* Changement de la police globale pour tout le site (Inter) */
html, body { margin:0; height:100%; font-family: 'Inter', sans-serif; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
  padding:0;
}

.macbook-air {
  background: linear-gradient(113deg, rgba(35,26,76,1) 0%, rgba(43,1,230,1) 100%);
  width:100vw;
  height:100vh;
  min-width:1280px;
  min-height:832px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10vh;
}

/* Le titre principal reste inchangé en Arial Black comme tu le souhaitais */
.text-wrapper {
  font-family:"arial black";
  font-weight: 900;
  font-size: 10vw;
  color:#fff;
  text-shadow:0px 4px 40px rgba(0,0,0,0.7);
  margin-bottom:5vh;
}

.rectangle {
  width:60vw;
  max-width:932px;
  height:7vh;
  background-color:white;
  border-radius: 10vh;
  box-shadow:0px 4px 30px rgba(0,0,0,0.5);
  position:relative;
}

.search-input {
  width:100%;
  height:100%;
  border:none;
  background:transparent;
  font-size:2vh;
  font-family:"Inter", sans-serif;
  font-weight: 500;
  padding-left:2vw;
  outline:none;
  color:#000;
}
.search-input::placeholder {
    color: rgba(0,0,0,0.7);
}

.div {
  color:rgba(0,0,0,0.7);
  text-shadow:0px 4px 10px rgba(0,0,0,0.5);
  font-size:2vh;
  margin-top:1vh;
  text-align:center;
}

.results {
  width:60vw;
  max-width:932px;
  max-height:40vh;
  margin-top:3vh;
  overflow-y:visible;
}

.result {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:20px;
  box-shadow:0px 4px 10px rgba(0,0,0,0.5);
  position: relative;
}

.category { font-weight:700; color:#555; }
.word { font-size:18px; font-weight:700; }
.translation { font-size:16px; color:#333; margin-left:5px; }
.subword { margin-left:15px; margin-top: 5px; margin-bottom: 5px; }
.highlight { background: yellow; }

.etym-container {
  display: inline-block;
  position: relative;
  margin-left: 8px;
  cursor: pointer;
}

.info-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 18px;
  height: 18px;
  background-color: rgba(43,1,230,1);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  font-family: serif;
}

.tooltip {
  visibility: hidden;
  width: 280px;
  background-color: white;
  color: #333;
  text-align: left;
  border-radius: 20px;
  padding: 15px;
  position: absolute;
  z-index: 999;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  font-size: 14px;
  line-height: 1.45;
  box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
  font-weight: 400;
}

/* Le titre de la popup est maintenant en ULTRA BOLD grâce à la nouvelle police Inter ! */
.tooltip-title {
  display: block;
  font-weight: 900;          /* Ultra-gras supporté par Inter */
  font-size: 15px;
  text-transform: uppercase;
  color: rgba(43,1,230,1);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.etym-container:hover .tooltip {
  visibility: visible;
  opacity: 1;
  transform: translateX(-50%) translateY(-2px);
}
</style>
</head>
<body>

<div class="macbook-air">
  <div class="text-wrapper">Rather</div>
  <div class="rectangle">
    <input type="text" id="search" class="search-input" placeholder="Tape le mot que tu veux rechercher !">
  </div>
  <div class="results" id="results"></div>
</div>

<script src="Rather.js"></script>
<script>
const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");

function highlight(text, query){
  if(!text || !query) return text || "";
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

function createEtymHtml(etymText) {
  if (!etymText) return "";
  return `<span class="etym-container">
            <span class="info-icon">i</span>
            <span class="tooltip">
              <span class="tooltip-title">Étymologie</span>
              ${etymText}
            </span>
          </span>`;
}

function displayWord(category, word, value, query){
  const div = document.createElement("div");
  div.classList.add("result");

  if(typeof value === "string") {
    div.innerHTML = `<span class="category">${category}</span><br>
                     <span class="word">${highlight(word, query)}</span> : 
                     <span class="translation">${highlight(value, query)}</span>`;
  }
  else if (value && value.hasOwnProperty('trad')) {
    div.innerHTML = `<span class="category">${category}</span><br>
                     <span class="word">${highlight(word, query)}</span> : 
                     <span class="translation">${highlight(value.trad, query)}</span>${createEtymHtml(value.etym)}`;
  }
  else {
    let html = `<span class="category">${category}</span><br><span class="word">${highlight(word, query)}</span> :`;
    for(const subword in value){
      const subValue = value[subword];
      if (typeof subValue === "object" && subValue !== null && subValue.hasOwnProperty('trad')) {
        html += `<div class="subword">${highlight(subword, query)} : ${highlight(subValue.trad, query)}${createEtymHtml(subValue.etym)}</div>`;
      } else {
        html += `<div class="subword">${highlight(subword, query)} : ${highlight(subValue, query)}</div>`;
      }
    }
    div.innerHTML = html;
  }

  resultsDiv.appendChild(div);
}

searchInput.addEventListener("input", () => {
  let query = searchInput.value.toLowerCase().trim();
  resultsDiv.innerHTML = "";
  if(!query) return;

  const shortResults = [];
  const longResults = [];
  const strictSearch = searchInput.value.includes(" ");

  for(const category in dico){
    for(const word in dico[category]){
      const value = dico[category][word];
      let match = false;

      let translationText = "";
      let isSubcategory = true;

      if (typeof value === "string") {
        translationText = value;
        isSubcategory = false;
      } else if (value && value.hasOwnProperty('trad')) {
        translationText = value.trad;
        isSubcategory = false;
      }

      if(!isSubcategory) {
        match = strictSearch ? (word.toLowerCase()===query || translationText.toLowerCase()===query)
                             : (word.toLowerCase().includes(query) || translationText.toLowerCase().includes(query));
      } else {
        for(const subword in value){
          const subValue = value[subword];
          let subTranslation = (typeof subValue === "object" && subValue !== null && subValue.hasOwnProperty('trad')) ? subValue.trad : subValue;
          
          if(strictSearch){
            if(subword.toLowerCase()===query || subTranslation.toLowerCase()===query){ match=true; break; }
          } else {
            if(subword.toLowerCase().includes(query) || subTranslation.toLowerCase().includes(query)){ match=true; break; }
          }
        }
      }

      if(match){
        const resultObj = {category, word, value};
        if(word.length<=2) shortResults.push(resultObj);
        else longResults.push(resultObj);
      }
    }
  }

  const combined = shortResults.concat(longResults).slice(0,5);
  combined.forEach(r => displayWord(r.category,r.word,r.value,query));
});
</script>

</body>
</html>
