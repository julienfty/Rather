<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather</title>
<style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap");

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

/* Changement de la police globale pour tout le site (Inter) */
html, body { margin:0; height:100%; font-family: 'Inter', sans-serif; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
  padding:0;
}

.macbook-air {
  background: linear-gradient(113deg, rgba(35,26,76,1) 0%, rgba(43,1,230,1) 100%);
  width:100vw;
  height:100vh;
  min-width:1280px;
  min-height:832px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10vh;
}

/* Le titre principal reste inchangé en Arial Black comme tu le souhaitais */
.text-wrapper {
  font-family:"arial black";
  font-weight: 900;
  font-size: 10vw;
  color:#fff;
  text-shadow:0px 4px 40px rgba(0,0,0,0.7);
  margin-bottom:5vh;
}

.rectangle {
  width:60vw;
  max-width:932px;
  height:7vh;
  background-color:white;
  border-radius: 10vh;
  box-shadow:0px 4px 30px rgba(0,0,0,0.5);
  position:relative;
}

.search-input {
  width:100%;
  height:100%;
  border:none;
  background:transparent;
  font-size:2vh;
  font-family:"Inter", sans-serif;
  font-weight: 500;
  padding-left:2vw;
  outline:none;
  color:#000;
}
.search-input::placeholder {
    color: rgba(0,0,0,0.7);
}

.div {
  color:rgba(0,0,0,0.7);
  text-shadow:0px 4px 10px rgba(0,0,0,0.5);
  font-size:2vh;
  margin-top:1vh;
  text-align:center;
}

.results {
  width:60vw;
  max-width:932px;
  max-height:40vh;
  margin-top:3vh;
  overflow-y:visible;
}

/* MODIFIÉ : Utilisation de flexbox pour aérer verticalement sans chevauchement */
.result {
  background:white;
  padding:18px; /* Un poil plus d'espace interne */
  margin-bottom:12px;
  border-radius:20px;
  box-shadow:0px 4px 10px rgba(0,0,0,0.5);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* MODIFIÉ : On lui donne sa propre hauteur de ligne et un espacement net en dessous */
.category { 
  font-weight:700; 
  color:#555; 
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px; /* Crée la barrière de sécurité pour que le mot du dessous ne monte pas */
  line-height: 1.2;
}

/* MODIFIÉ : Augmentation de la hauteur de ligne pour caler les majuscules (ex: J) */
.word { 
  font-size:20px; 
  font-weight:700; 
  line-height: 1.4; /* Donne de l'air au-dessus et en-dessous de la police */
}

.translation { font-size:16px; color:#333; margin-left:5px; }

/* MODIFIÉ : Hauteur de ligne plus propre */
.subword { 
  margin-left:15px; 
  margin-top: 6px; 
  margin-bottom: 4px; 
  line-height: 1.4;
}

.highlight { background: yellow; }

.etym-container {
  display: inline-block;
  position: relative;
  margin-left: 8px;
  cursor: pointer;
}

.info-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 18px;
  height: 18px;
  background-color: rgba(43,1,230,1);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  font-family: serif;
}

/* LA POPUP LOOK INVERSE iOS FROSTED GLASS */
.tooltip {
  visibility: hidden;
  width: 280px;
  
  /* Fond blanc transparent à 60% pour l'effet verre */
  background-color: rgba(255, 255, 255, 0.6) !important; 
  color: #111;
  text-align: left;
  border-radius: 20px;
  padding: 15px;
  position: absolute;
  z-index: 9999; /* Augmenté pour passer devant absolument tout */
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  font-size: 14px;
  line-height: 1.45;
  box-shadow: 0px 8px 30px rgba(0,0,0,0.15);
  font-weight: 500;

  /* EFFET DE FLOU iOS DERRIÈRE LA POPUP */
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
}

/* Le titre de la popup en ULTRA BOLD */
.tooltip-title {
  display: block;
  font-weight: 900;          /* Ultra-gras supporté par Inter */
  font-size: 15px;
  text-transform: uppercase;
  color: rgba(43,1,230,1);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

/* EFFET EN COULISSE AU SURVOL (FORCE L'OPACITÉ À 100%) */
.etym-container:hover .tooltip {
  visibility: visible !important;
  opacity: 1 !important; /* Force l'opacité max sur l'élément */
  transform: translateX(-50%) translateY(-2px);
}
</style>
</head>
<body>

<div class="macbook-air">
  <div class="text-wrapper">Rather</div>
  <div class="rectangle">
    <input type="text" id="search" class="search-input" placeholder="Tape le mot que tu veux rechercher !">
  </div>
  <div class="results" id="results"></div>
</div>


<!-- 1. ON CHARGE LA BIBLIOTHÈQUE SUPABASE TOUT EN HAUT DU SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 2. CONFIGURATION DE TA CONNEXION
const SUPABASE_URL = "https://hfrdzcjfienvegrofszz.supabase.co";
const SUPABASE_KEY = "sb_publishable_U6qUMbeePU0ykN99-OQsNg_FGYTo0iZ";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");

// Garde ta fonction de surlignage intacte !
function highlight(text, query){
  if(!text || !query) return text || "";
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

// Génère la petite icône 'i' avec l'infobulle d'étymologie
function createEtymHtml(etymText) {
  if (!etymText) return "";
  return `<span class="etym-container">
            <span class="info-icon">i</span>
            <span class="tooltip">
              <span class="tooltip-title">Étymologie</span>
              ${etymText}
            </span>
          </span>`;
}

// 3. LA FONCTION D'AFFICHAGE INTELLIGENTE ET INVERSABLE !
function displayWordFromSupabase(row, query) {
  const div = document.createElement("div");
  div.classList.add("result");

  const category = row.categorie || "Mot";
  let html = `<span class="category">${category}</span><br>`;

  // Sécurité pour les traductions
  let traductions = [];
  if (row.mots_francais) {
    traductions = Array.isArray(row.mots_francais) ? row.mots_francais : [row.mots_francais];
  }

  // --- LE DESIGN S'ADAPTE AU SENS DE LA RECHERCHE ---
  if (row.directionRecherche === "FR_TO_RATHER") {
    // L'utilisateur a cherché du français : On met le Français en gros !
    const principalFr = traductions[0] ? traductions[0].traduction_fr : "Mot français";
    const contexteFr = traductions[0]?.contexte_fr ? `<span class="category">(${traductions[0].contexte_fr})</span> ` : '';
    
    html += `<span class="word">${contexteFr}${highlight(principalFr, query)}</span> :`;
    
    if (traductions[0]?.etymologie) {
      html += ` ${createEtymHtml(traductions[0].etymologie)}`;
    }

    // CORRECTIF ICI : On vire l'opacity: 0.85 du style, et on utilise color: rgba(...) à la place !
    html += `<div class="subword" style="font-size: 0.9em; color: rgba(0,0,0,0.75); margin-top: 4px;">
              ➔ Traduction en Rather : <strong style="color: #000;">${highlight(row.mot, query)}</strong>
              ${row.etymologie ? createEtymHtml(row.etymologie) : ''}
            </div>`;

  } else {
    // L'utilisateur a cherché du Rather : Rather en gros !
    html += `<span class="word">${highlight(row.mot, query)}</span> :`;

    if (row.etymologie) {
      html += ` ${createEtymHtml(row.etymologie)}`;
    }

    // Les traductions françaises en petit en dessous
    if (traductions.length > 0) {
      traductions.forEach(sig => {
        const contexte = sig.contexte_fr ? `<span class="category">(${sig.contexte_fr})</span> ` : '';
        html += `<div class="subword">
                  ${contexte}${highlight(sig.traduction_fr, query)}
                  ${createEtymHtml(sig.etymologie)}
                </div>`;
      });
    } else {
      html += ` <span class="translation">Aucune traduction enregistrée</span>`;
    }
  }

  div.innerHTML = html;
  resultsDiv.appendChild(div);
}

// 4. L'ÉCOUTEUR DE RECHERCHE EN TEMPS RÉEL (LE CERVEAU DE L'ALGO)
searchInput.addEventListener("input", async () => {
  let query = searchInput.value.toLowerCase().trim();
  resultsDiv.innerHTML = "";
  if(!query) return;

  // Requêtes parallèles sur Supabase
  const requeteRather = supabaseClient
    .from('mots_rather')
    .select('mot, categorie, etymologie, mots_francais(traduction_fr, contexte_fr, etymologie)')
    .ilike('mot', `%${query}%`);

  const requeteFrancais = supabaseClient
    .from('mots_francais')
    .select('traduction_fr, contexte_fr, etymologie, mots_rather(mot, categorie, etymologie)')
    .ilike('traduction_fr', `%${query}%`);

  const [resRather, resFrancais] = await Promise.all([requeteRather, requeteFrancais]);

  if (resRather.error) console.error("Erreur recherche Rather :", resRather.error);
  if (resFrancais.error) console.error("Erreur recherche Français :", resFrancais.error);

  const donneesRather = resRather.data || [];
  const donneesFrancais = [];

  if (resFrancais.data) {
    resFrancais.data.forEach(item => {
      if (item.mots_rather) {
        const ratherObj = Array.isArray(item.mots_rather) ? item.mots_rather[0] : item.mots_rather;
        if (ratherObj) {
          donneesFrancais.push({
            mot: ratherObj.mot,
            categorie: ratherObj.categorie,
            etymologie: ratherObj.etymologie,
            mots_francais: [item]
          });
        }
      }
    });
  }

  // Fusion et dédoublonnement
  const listePlat = [...donneesRather, ...donneesFrancais];
  const resultatsUniques = [];
  const motsVus = new Set();

  listePlat.forEach(item => {
    if (item.mot && !motsVus.has(item.mot)) {
      motsVus.add(item.mot);
      resultatsUniques.push(item);
    }
  });

  // --- ALGORITHME DE DOUBLE SCORING & DÉTECTION DU SENS ---
  const resultatsScorés = resultatsUniques.map(item => {
    const ratherMot = item.mot ? item.mot.toLowerCase() : "";
    
    // 1. Calcul du score côté Rather
    let scoreRather = 0;
    if (ratherMot === query) scoreRather = 100;
    else if (ratherMot.startsWith(query)) scoreRather = 50;
    else if (ratherMot.includes(query)) scoreRather = 10;

    if (ratherMot) {
      const diffTaille = ratherMot.length - query.length;
      scoreRather -= diffTaille * 0.5;
    }

    // 2. Calcul du score côté Français
    let scoreFr = 0;
    if (item.mots_francais && Array.isArray(item.mots_francais)) {
      item.mots_francais.forEach(f => {
        if (f.traduction_fr) {
          const trad = f.traduction_fr.toLowerCase();
          let currentFrScore = 0;
          if (trad === query) currentFrScore = 100;
          else if (trad.startsWith(query)) currentFrScore = 50;
          else if (trad.includes(query)) currentFrScore = 10;

          const diffTailleFr = trad.length - query.length;
          currentFrScore -= diffTailleFr * 0.5;

          if (currentFrScore > scoreFr) scoreFr = currentFrScore;
        }
      });
    }

    // 3. On détermine le gagnant et la direction de l'affichage
    let finalScore = 0;
    let directionRecherche = "RATHER_TO_FR"; // Par défaut

    if (scoreRather >= scoreFr) {
      finalScore = scoreRather;
      directionRecherche = "RATHER_TO_FR"; // L'utilisateur cherche du Rather
    } else {
      finalScore = scoreFr;
      directionRecherche = "FR_TO_RATHER"; // L'utilisateur cherche du Français !
    }

    return { ...item, finalScore, directionRecherche, scoreRather };
  });

  // Tri final
  resultatsScorés.sort((a, b) => {
    if (b.finalScore === a.finalScore) {
      return a.mot.localeCompare(b.mot); // Tri alphabétique si égalité parfaite
    }
    return b.finalScore - a.finalScore;
  });

  // Affichage final du top 5
  if (resultatsScorés.length > 0) {
    resultatsScorés.slice(0, 5).forEach(row => displayWordFromSupabase(row, query));
  }
});
</script>
</body>
</html>
