<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rather</title>
<style>
@import url("https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css");
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap");

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

/* Changement de la police globale pour tout le site (Inter) */
html, body { margin:0; height:100%; font-family: 'Inter', sans-serif; }

body {
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:#fff;
  padding:0;
}

.macbook-air {
  background: linear-gradient(113deg, rgba(35,26,76,1) 0%, rgba(43,1,230,1) 100%);
  width:100vw;
  height:100vh;
  min-width:1280px;
  min-height:832px;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:10vh;
}

/* Le titre principal reste inchangé en Arial Black comme tu le souhaitais */
.text-wrapper {
  font-family:"arial black";
  font-weight: 900;
  font-size: 10vw;
  color:#fff;
  text-shadow:0px 4px 40px rgba(0,0,0,0.7);
  margin-bottom:5vh;
}

.rectangle {
  width:60vw;
  max-width:932px;
  height:7vh;
  background-color:white;
  border-radius: 10vh;
  box-shadow:0px 4px 30px rgba(0,0,0,0.5);
  position:relative;
}

.search-input {
  width:100%;
  height:100%;
  border:none;
  background:transparent;
  font-size:2vh;
  font-family:"Inter", sans-serif;
  font-weight: 500;
  padding-left:2vw;
  outline:none;
  color:#000;
}
.search-input::placeholder {
    color: rgba(0,0,0,0.7);
}

.div {
  color:rgba(0,0,0,0.7);
  text-shadow:0px 4px 10px rgba(0,0,0,0.5);
  font-size:2vh;
  margin-top:1vh;
  text-align:center;
}

.results {
  width:60vw;
  max-width:932px;
  max-height:40vh;
  margin-top:3vh;
  overflow-y:visible;
}

.result {
  background:white;
  padding:15px;
  margin-bottom:10px;
  border-radius:20px;
  box-shadow:0px 4px 10px rgba(0,0,0,0.5);
  position: relative;
}

.category { font-weight:700; color:#555; }
.word { font-size:18px; font-weight:700; }
.translation { font-size:16px; color:#333; margin-left:5px; }
.subword { margin-left:15px; margin-top: 5px; margin-bottom: 5px; }
.highlight { background: yellow; }

.etym-container {
  display: inline-block;
  position: relative;
  margin-left: 8px;
  cursor: pointer;
}

.info-icon {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 18px;
  height: 18px;
  background-color: rgba(43,1,230,1);
  color: white;
  border-radius: 50%;
  font-size: 11px;
  font-weight: bold;
  font-family: serif;
}

.tooltip {
  visibility: hidden;
  width: 280px;
  background-color: white;
  color: #333;
  text-align: left;
  border-radius: 20px;
  padding: 15px;
  position: absolute;
  z-index: 999;
  bottom: 130%;
  left: 50%;
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  font-size: 14px;
  line-height: 1.45;
  box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
  font-weight: 400;
}

/* Le titre de la popup est maintenant en ULTRA BOLD grâce à la nouvelle police Inter ! */
.tooltip-title {
  display: block;
  font-weight: 900;          /* Ultra-gras supporté par Inter */
  font-size: 15px;
  text-transform: uppercase;
  color: rgba(43,1,230,1);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.etym-container:hover .tooltip {
  visibility: visible;
  opacity: 1;
  transform: translateX(-50%) translateY(-2px);
}
</style>
</head>
<body>

<div class="macbook-air">
  <div class="text-wrapper">Rather</div>
  <div class="rectangle">
    <input type="text" id="search" class="search-input" placeholder="Tape le mot que tu veux rechercher !">
  </div>
  <div class="results" id="results"></div>
</div>

<script src="Rather.js"></script>
<!-- 1. ON CHARGE LA BIBLIOTHÈQUE SUPABASE TOUT EN HAUT DU SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// 2. CONFIGURATION DE TA CONNEXION (Mets tes vraies clés ici)
const SUPABASE_URL = "https://hfrdzcjfienvegrofszz.supabase.co";
const SUPABASE_KEY = "sb_publishable_U6qUMbeePU0ykN99-OQsNg_FGYTo0iZ";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");

// Garde ta fonction de surlignage intacte !
function highlight(text, query){
  if(!text || !query) return text || "";
  const regex = new RegExp(`(${query})`, 'gi');
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

// Génère la petite icône 'i' avec l'infobulle d'étymologie
function createEtymHtml(etymText) {
  if (!etymText) return "";
  return `<span class="etym-container">
            <span class="info-icon">i</span>
            <span class="tooltip">
              <span class="tooltip-title">Étymologie</span>
              ${etymText}
            </span>
          </span>`;
}

// 3. LA NOUVELLE FONCTION D'AFFICHAGE ADAPTÉE À SUPABASE
function displayWordFromSupabase(row, query) {
  const div = document.createElement("div");
  div.classList.add("result");

  // On récupère la catégorie du mot Rather, ou une valeur par défaut s'il n'y en a pas
  const category = row.categorie || "Mot";
  
  // On commence à construire le HTML avec la catégorie et le mot Rather
  let html = `<span class="category">${category}</span><br>
              <span class="word">${highlight(row.mot, query)}</span> :`;

  // ÉTAPE A : Est-ce qu'il y a une étymologie GLOBALE sur le mot ?
  if (row.etymologie) {
    html += ` ${createEtymHtml(row.etymologie)}`;
  }

  // ÉTAPE B : On affiche toutes ses significations françaises liées
  if (row.mots_francais && row.mots_francais.length > 0) {
  row.mots_francais.forEach(sig => {
      // S'il y a un contexte (ex: "Taille"), on l'affiche proprement
      const contexte = sig.contexte_fr ? `<span class="category">(${sig.contexte_fr})</span> ` : '';
      
      // On affiche la traduction + l'étymologie SPÉCIFIQUE à ce sens s'il y en a une
      html += `<div class="subword">
                ${contexte}${highlight(sig.traduction_fr, query)}
                ${createEtymHtml(sig.etymologie)}
              </div>`;
    });
  } else {
    html += ` <span class="translation">Aucune traduction enregistrée</span>`;
  }

  div.innerHTML = html;
  resultsDiv.appendChild(div);
}

// 4. L'ÉCOUTEUR DE RECHERCHE EN TEMPS RÉEL SUR SUPABASE
searchInput.addEventListener("input", async () => {
  let query = searchInput.value.toLowerCase().trim();
  resultsDiv.innerHTML = "";
  if(!query) return;

  // On prépare la requête magique qui fouille dans les deux tables en même temps !
  // On demande le mot, sa catégorie, son étymologie globale, et TOUTES ses significations
  let recherche = supabase
    .from('mots_rather')
    .select(`
      mot,
      categorie,
      etymologie,
      mots_francais (
        traduction_fr,
        contexte_fr,
        etymologie
      )
    `);

  // Gestion de la recherche stricte (si l'utilisateur met un espace)
  if (searchInput.value.includes(" ")) {
    recherche = recherche.or(`mot.ilike.${query},significations.traduction_fr.ilike.${query}`);
  } else {
    // Recherche floue (contient le mot)
    recherche = recherche.or(`mot.ilike.*${query}*,significations.traduction_fr.ilike.*${query}*`);
  }

  // On limite à 5 résultats maximum comme dans ton ancien code
  const { data, error } = await recherche.limit(5);

  if (error) {
    console.error("Erreur Supabase :", error);
    return;
  }

  // On affiche les résultats trouvés à l'écran
  if (data && data.length > 0) {
    data.forEach(row => displayWordFromSupabase(row, query));
  }
});
</script>

</body>
</html>
