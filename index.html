<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/dico_rather.css">
<title>Rather</title>

</head>
<body>

<div class="macbook-air">
  <div class="text-wrapper">Rather</div>
  
  <div class="search-wrapper">
    <div class="rectangle" id="search-container">
      <input type="text" id="search" class="search-input" placeholder="Rechercher">
      <button class="close-btn" id="close-expanded">Fermer</button>
      
      <div class="expanded-content">
        <div class="filter-container">
          <div class="filter-bar" id="main-filter-bar"></div>
          <div class="filter-bar" id="sub-filter-bar"></div>
        </div>
        <div class="expanded-scroll-area" id="expanded-results"></div>
      </div>
    </div>
    
    <div class="see-all-notch" id="see-all-trigger">
      Tout voir <span>▼</span>
    </div>
  </div>
  <nav>
    <a href="translator.html" class="btn-nav">traducteur</a>
</nav>
  <div class="results" id="results"></div>
</div>

<div id="global-tooltip"></div>

<script>
const globalTooltip = document.getElementById('global-tooltip');
let activeIcon = null;

function showTooltip(icon) {
  const title = icon.getAttribute('data-title') || "Étymologie";
  const text = icon.getAttribute('data-text');
  if (!text) return;

  globalTooltip.innerHTML = `<span class="tooltip-title">${title}</span>${text}`;
  globalTooltip.style.display = 'block';

  const rect = icon.getBoundingClientRect();
  let topPosition = rect.top + window.scrollY - globalTooltip.offsetHeight - 10;
  let leftPosition = rect.left + window.scrollX - (globalTooltip.offsetWidth / 2) + (rect.width / 2);

  if (leftPosition < 10) leftPosition = 10;
  if (leftPosition + globalTooltip.offsetWidth > window.innerWidth - 10) {
    leftPosition = window.innerWidth - globalTooltip.offsetWidth - 10;
  }

  globalTooltip.style.top = topPosition + 'px';
  globalTooltip.style.left = leftPosition + 'px';
  activeIcon = icon;
}

function hideTooltip() {
  globalTooltip.style.display = 'none';
  activeIcon = null;
}

const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

if (!isTouchDevice) {
  document.addEventListener('mouseover', function(e) {
    const icon = e.target.closest('.info-icon');
    if (icon) showTooltip(icon);
  });
  document.addEventListener('mouseout', function(e) {
    if (e.target.closest('.info-icon')) hideTooltip();
  });
} else {
  document.addEventListener('click', function(e) {
    const icon = e.target.closest('.info-icon');
    if (icon) {
      e.stopPropagation();
      if (activeIcon === icon) { hideTooltip(); } else { showTooltip(icon); }
    } else { hideTooltip(); }
  });
}

  const translatorBtn = document.querySelector('.btn-nav');
const searchInput = document.getElementById('search');
const seeAllTrigger = document.getElementById('see-all-trigger');
const closeBtn = document.getElementById('close-expanded');

// Fonction pour masquer le bouton
function hideBtn() {
    translatorBtn.classList.add('hidden');
}

// Fonction pour réafficher le bouton
function showBtn() {
    translatorBtn.classList.remove('hidden');
}

// 1. Quand on commence à taper dans la recherche
searchInput.addEventListener('focus', hideBtn);

// 2. Quand on ferme la recherche
closeBtn.addEventListener('click', showBtn);

// 3. Quand on clique sur "Tout voir"
seeAllTrigger.addEventListener('click', hideBtn);

// 4. Petit bonus : si on clique sur le bouton "Fermer" du menu
// assure-toi que ton bouton de nav réapparaît
closeBtn.addEventListener('click', () => {
    showBtn();
});
  
  searchInput.addEventListener('blur', () => {
    // On réaffiche si la barre est vide après un court délai
    setTimeout(() => {
        if (searchInput.value === "") showBtn();
    }, 200);
});
</script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/dico_rather.js"></script>
</body>
</html>
